            - generic [ref=f3e103]:
              - paragraph [ref=f3e104]:
                - generic [ref=f3e105]:
                  - generic [ref=f3e106]: The 30-inch Apple Cinema HD Display delivers an amazing 2560 x 1600 pixel resolution. Designed specifically for the creative professional, this display provides more space for easier access to all the tools and palettes needed to edit, format and composite your work. Combine this display with a Mac Pro, MacBook Pro, or PowerMac G5 and there's no limit to what you can achieve.
                  - generic [ref=f3e107]: The Cinema HD features an active-matrix liquid crystal display that produces flicker-free images that deliver twice the brightness, twice the sharpness and twice the contrast ratio of a typical CRT display. Unlike other flat panels, it's designed with a pure digital interface to deliver distortion-free images that never need adjusting. With over 4 million digital pixels, the display is uniquely suited for scientific and technical applications such as visualizing molecular structures or analyzing geological data.
                  - generic [ref=f3e108]: "Offering accurate, brilliant color performance, the Cinema HD delivers up to 16.7 million colors across a wide gamut allowing you to see subtle nuances between colors from soft pastels to rich jewel tones. A wide viewing angle ensures uniform color from edge to edge. Apple's ColorSync technology allows you to create custom profiles to maintain consistent color onscreen and in print. The result: You can confidently use this display in all your color-critical applications."
                  - generic [ref=f3e109]: Housed in a new aluminum design, the display has a very thin bezel that enhances visual accuracy. Each display features two FireWire 400 ports and two USB 2.0 ports, making attachment of desktop peripherals, such as iSight, iPod, digital and still cameras, hard drives, printers and scanners, even more accessible and convenient. Taking advantage of the much thinner and lighter footprint of an LCD, the new displays support the VESA (Video Electronics Standards Association) mounting interface standard. Customers with the optional Cinema Display VESA Mount Adapter kit gain the flexibility to mount their display in locations most appropriate for their work environment.
                  - generic [ref=f3e110]: The Cinema HD features a single cable design with elegant breakout for the USB 2.0, FireWire 400 and a pure digital connection using the industry standard Digital Video Interface (DVI) interface. The DVI connection allows for a direct pure-digital connection.
              - heading "Features:" [level=3] [ref=f3e111]
              - paragraph [ref=f3e112]: Unrivaled display performance
              - list [ref=f3e113]:
                - listitem [ref=f3e114]: 30-inch (viewable) active-matrix liquid crystal display provides breathtaking image quality and vivid, richly saturated color.
                - listitem [ref=f3e115]: Support for 2560-by-1600 pixel resolution for display of high definition still and video imagery.
                - listitem [ref=f3e116]: Wide-format design for simultaneous display of two full pages of text and graphics.
                - listitem [ref=f3e117]: Industry standard DVI connector for direct attachment to Mac- and Windows-based desktops and notebooks
                - listitem [ref=f3e118]: Incredibly wide (170 degree) horizontal and vertical viewing angle for maximum visibility and color performance.
                - listitem [ref=f3e119]: Lightning-fast pixel response for full-motion digital video playback.
                - listitem [ref=f3e120]: Support for 16.7 million saturated colors, for use in all graphics-intensive applications.
              - paragraph [ref=f3e121]: Simple setup and operation
              - list [ref=f3e122]:
                - listitem [ref=f3e123]: Single cable with elegant breakout for connection to DVI, USB and FireWire ports
                - listitem [ref=f3e124]: Built-in two-port USB 2.0 hub for easy connection of desktop peripheral devices.
                - listitem [ref=f3e125]: Two FireWire 400 ports to support iSight and other desktop peripherals
